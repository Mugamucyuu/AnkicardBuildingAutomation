name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/windows/requirements-build.txt
      - name: Run application and lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Audit public source
        run: python tools/audit_release.py
      - name: Prepare signed toolchain
        shell: pwsh
        run: ./tools/prepare_windows_toolchain.ps1
      - name: Build installer
        shell: pwsh
        run: ./tools/build_windows.ps1 -Iscc output/toolchain/inno/ISCC.exe -WebViewInstaller output/toolchain/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
      - name: Verify frozen desktop
        run: python tools/check_desktop.py dist/Ankicard/Ankicard.exe
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: |
          $version = python -c "from vocab_app import __version__; print(__version__)"
          ./tools/check_windows_installer.ps1 -Installer "dist/windows/Ankicard-$version-windows-x64-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: |
            build/pyinstaller/ankicard/warn-ankicard.txt
            output/installer-test-*/user-state/jobs/*/job.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from vocab_app import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: release-assets
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Ankicard $RELEASE_TAG" --notes-file docs/releases/0.2.0.md
