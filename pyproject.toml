[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ankicard-building-automation"
version = "0.2.0"
description = "A local multilingual vocabulary workbench for Anki"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "vocab_app/resources/data/pronunciation/kanjium/LICENSE.txt"]
authors = [{name = "Mugamucyuu"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/Mugamucyuu/AnkicardBuildingAutomation"
Issues = "https://github.com/Mugamucyuu/AnkicardBuildingAutomation/issues"

[project.optional-dependencies]
desktop = ["pywebview==6.1; sys_platform == 'win32'"]

[project.scripts]
ankicard = "vocab_app.ui_server:main"
ankicard-import = "vocab_app.cli:main"
ankicard-desktop = "vocab_app.desktop:main"

[tool.setuptools.packages.find]
include = ["vocab_app*"]
namespaces = false

[tool.setuptools.package-data]
vocab_app = ["web/*", "resources/prompts/*", "resources/examples/*.json", "resources/examples/vocabulary/*", "resources/data/tags/*", "resources/data/pronunciation/kanjium/*"]
