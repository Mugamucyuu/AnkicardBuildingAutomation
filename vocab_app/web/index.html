<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Studio</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="app"><aside class="rail"><a class="brand" href="/"><span class="brand-icon">語</span><span>Vocabulary<br><b>Studio</b></span></a><div class="rail-label" data-i18n="workspace"></div><nav aria-label="Navigation"><button data-page="import" class="active"><span>＋</span><span data-i18n="import"></span></button><button data-page="jobs"><span>◷</span><span data-i18n="jobs"></span><span id="job-count" class="count">0</span></button><button data-page="prompts"><span>≡</span><span data-i18n="prompts"></span></button><button data-page="tags"><span>⌘</span><span data-i18n="tags"></span></button><button data-page="settings"><span>⚙</span><span data-i18n="settings"></span></button></nav><div class="rail-footer"><span class="dot"></span><span data-i18n="localApp"></span><p data-i18n="localHint"></p></div></aside>
<main><header class="topbar"><span class="eyebrow" data-i18n="workbench"></span><div><span id="anki-status" class="badge" data-i18n="unchecked"></span><button class="quiet" id="connect" data-i18n="connect"></button></div></header><div id="notice" role="status" hidden></div>
<section id="page-import" class="page"><div class="heading"><div><span class="eyebrow">01 / IMPORT</span><h1 data-i18n="importTitle"></h1><p data-i18n="importSubtitle"></p></div><button class="secondary" id="demo" data-i18n="demo"></button></div>
<form id="import-form"><div class="import-grid"><div class="stack"><article class="panel"><div class="panel-title"><span class="step">1</span><h2 data-i18n="vocabulary"></h2><span id="word-count" class="muted"></span></div><div class="two-col"><label><span data-i18n="language"></span><select id="language"><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label><label><span data-i18n="localList"></span><select id="vocabulary"><option value="" data-i18n="chooseFile"></option></select></label></div><label class="dropzone"><input type="file" id="words-file" accept=".txt,.md" hidden><strong data-i18n="uploadWords"></strong><span data-i18n="fileHint"></span></label><label><span class="sr-only" data-i18n="words"></span><textarea id="words" rows="9" placeholder="peninsula&#10;curd&#10;pine after" required></textarea></label><p class="hint" data-i18n="wordHint"></p></article>
<article class="panel"><div class="panel-title"><span class="step">2</span><h2 data-i18n="generation"></h2></div><div class="mode-grid"><label class="mode"><input type="radio" name="mode" value="independent" checked><b data-i18n="independent"></b><small data-i18n="independentHint"></small></label><label class="mode"><input type="radio" name="mode" value="web"><b data-i18n="web"></b><small data-i18n="webHint"></small></label><label class="mode"><input type="radio" name="mode" value="sources"><b data-i18n="sources"></b><small data-i18n="sourcesHint"></small></label></div><div id="dictionary-wrap" hidden><label data-i18n="dictionaries"></label><div id="dictionaries" class="checks"></div><p class="hint" data-i18n="dictionaryHint"></p></div><p id="search-hint" class="hint" hidden data-i18n="searchHint"></p><div class="two-col"><label><span data-i18n="provider"></span><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="offline" data-i18n="offline"></option></select></label><label><span data-i18n="model"></span><input id="model" value="deepseek-flash" maxlength="120"></label></div><label><span data-i18n="extraPrompt"></span><select id="supplement"><option value="" data-i18n="none"></option></select></label><p class="hint" data-i18n="promptHint"></p></article></div>
<div class="stack"><article class="panel"><div class="panel-title"><span class="step">3</span><h2 data-i18n="destination"></h2></div><label><span data-i18n="deck"></span><input id="deck" list="deck-options" maxlength="200" data-placeholder="deckNameHint"><datalist id="deck-options"></datalist><p class="hint" data-i18n="deckCreateHint"></p></label><label><span data-i18n="tagSource"></span><select id="tag-source"><option value="anki" data-i18n="ankiTags"></option><option value="seed" data-i18n="seedTags"></option></select></label><div class="rule-note"><span>↳</span><p data-i18n="tagRules"></p></div><label class="checkbox"><input type="checkbox" id="auto-import"><span data-i18n="autoImport"></span></label><p class="hint" data-i18n="duplicateHint"></p></article><article class="panel"><h2 data-i18n="media"></h2><label><span data-i18n="audio"></span><select id="audio"></select></label><label><span data-i18n="image"></span><select id="image"><option value="auto" data-i18n="firstImage"></option><option value="none" data-i18n="disabled"></option></select></label><p class="hint" data-i18n="mediaHint"></p></article><div class="run-box"><span class="eyebrow" data-i18n="readyToCreate"></span><p data-i18n="runHint"></p><button type="submit" class="primary" id="start" data-i18n="start"></button></div></div></div></form></section>
<section id="page-jobs" class="page" hidden><div class="heading"><div><span class="eyebrow">02 / ACTIVITY</span><h1 data-i18n="jobs"></h1><p data-i18n="jobsHint"></p></div><button id="refresh-jobs" class="secondary" data-i18n="refresh"></button></div><div id="jobs-list" class="stack"></div></section>
<section id="page-prompts" class="page" hidden><div class="heading"><div><span class="eyebrow">03 / PROMPTS</span><h1 data-i18n="prompts"></h1><p data-i18n="allPrompts"></p></div><label id="upload-prompt-button" class="button secondary"><input type="file" id="prompt-file" accept=".txt,.md" hidden><span data-i18n="uploadPrompt"></span></label></div><article class="panel"><label><span data-i18n="promptType"></span><select id="prompt-type"></select></label><p class="hint" data-i18n="typedPromptHint"></p><div id="prompt-stages" class="prompt-stages"></div><p class="hint" data-i18n="promptSafety"></p></article><article class="panel"><h2 data-i18n="promptLibrary"></h2><label><select id="prompt-reader"></select></label><pre id="prompt-text"></pre></article></section>
<section id="page-tags" class="page" hidden><div class="heading"><div><span class="eyebrow">04 / KNOWLEDGE MAP</span><h1 data-i18n="tags"></h1><p data-i18n="tagsHint"></p></div><button id="sync-tags" class="secondary" data-i18n="syncTags"></button></div><article class="panel"><div class="toolbar"><input id="tag-search" type="search" data-placeholder="filterTags"><label class="checkbox"><input type="checkbox" id="only-anki" checked><span data-i18n="onlyAnki"></span></label><button id="expand-tags" class="quiet" data-i18n="expand"></button><button id="collapse-tags" class="quiet" data-i18n="collapse"></button><button id="seed-tags" class="quiet" data-i18n="viewSeed"></button></div><div class="tag-actions"><span id="tag-summary" class="muted"></span><select id="tag-match"><option value="all" data-i18n="matchAll"></option><option value="any" data-i18n="matchAny"></option></select><button id="browse-tags" class="secondary" data-i18n="browseTags"></button></div><p class="hint" data-i18n="tagBrowseHint"></p><div id="tag-tree" class="tree"></div></article></section>
<section id="page-settings" class="page" hidden><div class="heading"><div><span class="eyebrow">05 / PREFERENCES</span><h1 data-i18n="settings"></h1><p data-i18n="settingsHint"></p></div></div><form id="settings-form"><div class="two-col settings-grid"><article class="panel"><h2 data-i18n="appearance"></h2><label><span data-i18n="uiLanguage"></span><select id="locale"><option value="zh">简体中文</option><option value="ja">日本語</option><option value="en">English</option></select></label><label><span data-i18n="theme"></span><select id="theme"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label><p class="hint" data-i18n="languageHint"></p><h2 data-i18n="defaults"></h2><label><span data-i18n="provider"></span><select id="default-provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option></select></label><label><span data-i18n="model"></span><input id="default-model" maxlength="120"></label></article><article class="panel"><h2 data-i18n="credentials"></h2><p class="hint" data-i18n="keyHint"></p><label>DeepSeek <span class="key-status" id="deepseek-status"></span><input id="key-deepseek" type="password" autocomplete="new-password" placeholder="sk-…"></label><label>OpenAI <span class="key-status" id="openai-status"></span><input id="key-openai" type="password" autocomplete="new-password" placeholder="sk-…"></label><label><span data-i18n="searchKey"></span><input id="key-search" type="password" autocomplete="new-password" placeholder="sk-…"></label><p class="hint" data-i18n="searchHint"></p></article></div><button class="primary" type="submit" data-i18n="saveSettings"></button></form></section>
<footer><span>Vocabulary Studio · Local workspace</span><span data-i18n="footer"></span></footer></main></div>
<dialog id="preview-dialog"><div class="dialog-bar"><strong id="preview-title"></strong><button id="preview-theme" class="quiet" data-i18n="togglePreviewTheme"></button><a id="open-preview" target="_blank" rel="noopener" data-i18n="openPreview"></a><button id="close-preview" class="secondary" data-i18n="close"></button></div><iframe id="preview-frame" title="Card preview" sandbox="allow-same-origin"></iframe></dialog></body></html>
